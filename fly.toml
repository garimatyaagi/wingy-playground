# Fly.io configuration for 365Tasks worker
# Deploy with: fly launch --no-deploy && fly secrets set SCHEDULER_URL=... CRON_SECRET=... && fly deploy

app = "365tasks-worker"
primary_region = "bom"  # Mumbai - closest to Asia/Kolkata

[build]
  dockerfile = "worker/Dockerfile"

[env]
  NODE_ENV = "production"

# No HTTP service needed - this is a background worker
# Fly will keep it running as a "machine" without needing health checks

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
